# Fork-only benchmark workflow; not intended to replace the production matrix.
name: Build speed experiments
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        type: choice
        options: [baseline, candidate, cache-policy]
        default: baseline
permissions:
  contents: read
  actions: write
jobs:
  windows-baseline:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'baseline'
    uses: ./.github/workflows/build.yml
    with:
      version-label: speed-baseline
      mode: ci
      matrix-json: >-
        [{"name":"Windows baseline","platform":"windows","artifact":"speedtest-windows","os":"windows-2022","arch":"x64","tiles":true,"sound":true,"ext":"zip","content-type":"application/zip"}]
      download-translations: false
      bundle-tilesets: false
      bundle-registry-mods: false
      package-artifacts: false
      run-tests: true
      upload-artifacts: false
      upload-to-release: false
  cache-seed:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'cache-policy'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        flavor: [linux, macos, windows, android]
        generation: [1, 2, 3]
    steps:
      - name: Create incompressible cache fixture
        run: |
          mkdir cache-fixture
          head -c 2000000 /dev/urandom > cache-fixture/payload
          sha256sum cache-fixture/payload > cache-fixture/SHA256SUMS
      - uses: actions/cache/save@v4
        with:
          path: cache-fixture
          key: bn-speed-retention-${{ github.run_id }}-${{ matrix.flavor }}-${{ matrix.generation }}
  cache-policy:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'cache-policy'
    needs: cache-seed
    runs-on: ubuntu-latest
    steps:
      - name: Compare all generations with one validated generation per flavor
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = `bn-speed-retention-${context.runId}-`;
            const read = async () => (await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, per_page: 100
            })).filter(cache => cache.key.startsWith(prefix));
            const before = await read();
            const flavors = ['linux', 'macos', 'windows', 'android'];
            const wanted = new Set(flavors.map(flavor => `${prefix}${flavor}-3`));
            if (before.length !== 12 || ![...wanted].every(key => before.some(cache => cache.key === key))) {
              throw new Error(`Expected twelve fixture generations: ${JSON.stringify(before)}`);
            }
            for (const cache of before.filter(cache => !wanted.has(cache.key))) {
              await github.rest.actions.deleteActionsCacheById({...context.repo, cache_id: cache.id});
            }
            const after = await read();
            if (after.length !== 4 || !after.every(cache => wanted.has(cache.key))) {
              throw new Error(`Retention failed: ${JSON.stringify(after)}`);
            }
            const bytes = caches => caches.reduce((total, cache) => total + cache.size_in_bytes, 0);
            const evidence = {before: {entries: before.length, bytes: bytes(before)}, after: {entries: after.length, bytes: bytes(after)}, caches: after};
            core.info(JSON.stringify(evidence));
            await core.summary.addHeading('Isolated cache retention experiment').addTable([
              [{data: 'Policy', header: true}, {data: 'Entries', header: true}, {data: 'Bytes', header: true}],
              ['All generations', String(before.length), String(bytes(before))],
              ['One generation per flavor', String(after.length), String(bytes(after))]
            ]).addRaw('Only this run’s fixture keys were deleted. This tests footprint and restore integrity, not production eviction or native build speed.').write();
  cache-restore:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'cache-policy'
    needs: cache-policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [linux, macos, windows, android]
    steps:
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: cache-fixture
          key: bn-speed-retention-${{ github.run_id }}-${{ matrix.flavor }}-3
          fail-on-cache-miss: true
      - name: Verify restored bytes
        run: |
          test '${{ steps.restore.outputs.cache-hit }}' = true
          sha256sum --check cache-fixture/SHA256SUMS
