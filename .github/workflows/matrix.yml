# Fork-only benchmark workflow; not intended to replace the production matrix.
name: Build speed experiments
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        type: choice
        options: [baseline, candidate, android-candidate, cache-policy, shader-cache]
        default: baseline
permissions:
  contents: read
  actions: write
jobs:
  windows-baseline:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'baseline'
    uses: ./.github/workflows/build.yml
    with:
      version-label: speed-baseline
      mode: ci
      matrix-json: >-
        [{"name":"Windows baseline","platform":"windows","artifact":"speedtest-windows","os":"windows-2022","arch":"x64","tiles":true,"sound":true,"ext":"zip","content-type":"application/zip"}]
      download-translations: false
      bundle-tilesets: false
      bundle-registry-mods: false
      package-artifacts: false
      run-tests: true
      upload-artifacts: false
      upload-to-release: false
  platform-candidate:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'candidate'
    uses: ./.github/workflows/build.yml
    with:
      version-label: speed-candidate
      mode: ci
      use-precompiled-shaders: true
      matrix-json: >-
        [{"name":"Windows shard comparison","platform":"windows","artifact":"speedtest-windows","os":"windows-2022","arch":"x64","tiles":true,"sound":true,"ext":"zip","content-type":"application/zip"},
         {"name":"Android shader reuse","platform":"android","artifact":"android-x64","os":"ubuntu-latest","android":"arm64","tiles":true,"sound":true,"ext":"apk","content-type":"application/apk"}]
      download-translations: false
      bundle-tilesets: false
      bundle-registry-mods: false
      package-artifacts: false
      run-tests: true
      android-localize: false
      upload-artifacts: false
      upload-to-release: false
  android-candidate:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'android-candidate'
    uses: ./.github/workflows/build.yml
    with:
      version-label: speed-candidate
      mode: ci
      use-precompiled-shaders: true
      matrix-json: >-
        [{"name":"Android shader reuse","platform":"android","artifact":"android-x64","os":"ubuntu-latest","android":"arm64","tiles":true,"sound":true,"ext":"apk","content-type":"application/apk"}]
      download-translations: false
      bundle-tilesets: false
      bundle-registry-mods: false
      package-artifacts: false
      run-tests: false
      android-localize: false
      upload-artifacts: false
      upload-to-release: false
  cache-seed:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'cache-policy'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        flavor: [linux, macos, windows, android]
        generation: [1, 2, 3]
    steps:
      - name: Create incompressible cache fixture
        run: |
          mkdir cache-fixture
          head -c 2000000 /dev/urandom > cache-fixture/payload
          sha256sum cache-fixture/payload > cache-fixture/SHA256SUMS
      - uses: actions/cache/save@v4
        with:
          path: cache-fixture
          key: bn-speed-retention-${{ github.run_id }}-${{ matrix.flavor }}-${{ matrix.generation }}
  cache-policy:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'cache-policy'
    needs: cache-seed
    runs-on: ubuntu-latest
    steps:
      - name: Compare all generations with one validated generation per flavor
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = `bn-speed-retention-${context.runId}-`;
            const read = async () => (await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, per_page: 100
            })).filter(cache => cache.key.startsWith(prefix));
            const before = await read();
            const flavors = ['linux', 'macos', 'windows', 'android'];
            const wanted = new Set(flavors.map(flavor => `${prefix}${flavor}-3`));
            if (before.length !== 12 || ![...wanted].every(key => before.some(cache => cache.key === key))) {
              throw new Error(`Expected twelve fixture generations: ${JSON.stringify(before)}`);
            }
            for (const cache of before.filter(cache => !wanted.has(cache.key))) {
              await github.rest.actions.deleteActionsCacheById({...context.repo, cache_id: cache.id});
            }
            const after = await read();
            if (after.length !== 4 || !after.every(cache => wanted.has(cache.key))) {
              throw new Error(`Retention failed: ${JSON.stringify(after)}`);
            }
            const bytes = caches => caches.reduce((total, cache) => total + cache.size_in_bytes, 0);
            const evidence = {before: {entries: before.length, bytes: bytes(before)}, after: {entries: after.length, bytes: bytes(after)}, caches: after};
            core.info(JSON.stringify(evidence));
            await core.summary.addHeading('Isolated cache retention experiment').addTable([
              [{data: 'Policy', header: true}, {data: 'Entries', header: true}, {data: 'Bytes', header: true}],
              ['All generations', String(before.length), String(bytes(before))],
              ['One generation per flavor', String(after.length), String(bytes(after))]
            ]).addRaw('Only this run’s fixture keys were deleted. This tests footprint and restore integrity, not production eviction or native build speed.').write();
  cache-restore:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'cache-policy'
    needs: cache-policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [linux, macos, windows, android]
    steps:
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: cache-fixture
          key: bn-speed-retention-${{ github.run_id }}-${{ matrix.flavor }}-3
          fail-on-cache-miss: true
      - name: Verify restored bytes
        run: |
          test '${{ steps.restore.outputs.cache-hit }}' = true
          sha256sum --check cache-fixture/SHA256SUMS
  shader-cold:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'shader-cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool libltdl-dev
      - name: Verify shader artifact and revision fixtures
        run: |
          bash build-scripts/shader-artifacts-test.sh
          bash build-scripts/shadercross-revision-test.sh
      - name: Cold pinned shadercross setup
        run: |
          mkdir -p out/shader-benchmark
          /usr/bin/time -f '%e' -o out/shader-benchmark/cold-seconds.txt bash build-scripts/install-shadercross-vcpkg.sh
      - name: Generate and validate real shaders
        run: |
          bash build-scripts/generate-shaders.sh
          bash build-scripts/verify-shader-artifacts.sh
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-shadercross
          key: bn-speed-shader-tool-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: speed-shaders
          path: data/shaders/
      - uses: actions/upload-artifact@v4
        with:
          name: shader-cold-evidence
          path: out/shader-benchmark/
  shader-warm:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'shader-cache'
    needs: shader-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool libltdl-dev
      - name: Mark cache restore start
        run: |
          mkdir -p out/shader-benchmark
          date +%s.%N > out/shader-benchmark/restore-start.txt
      - name: Restore pinned shadercross tree
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-shadercross
          key: bn-speed-shader-tool-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Warm shadercross setup
        run: |
          date +%s.%N > out/shader-benchmark/restore-end.txt
          /usr/bin/time -f '%e' -o out/shader-benchmark/warm-seconds.txt bash build-scripts/install-shadercross-vcpkg.sh
      - uses: actions/download-artifact@v4
        with:
          name: speed-shaders
          path: data/shaders/
      - name: Compare cold and restored tool outputs
        run: |
          cp data/shaders/shader-artifacts.manifest out/shader-benchmark/cold.manifest
          bash build-scripts/generate-shaders.sh
          bash build-scripts/verify-shader-artifacts.sh
          diff -u out/shader-benchmark/cold.manifest data/shaders/shader-artifacts.manifest
      - uses: actions/upload-artifact@v4
        with:
          name: shader-warm-evidence
          path: out/shader-benchmark/
  android-shader-task:
    if: github.repository == 'scarf005/Cataclysm-BN' && inputs.suite == 'shader-cache'
    needs: shader-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/download-artifact@v4
        with:
          name: speed-shaders
          path: data/shaders/
      - name: Consume shaders without installing shadercross
        working-directory: android
        run: |
          mkdir -p ../out/android-shader-task
          /usr/bin/time -f '%e' -o ../out/android-shader-task/consume-seconds.txt ./gradlew :app:compileAndroidShaders -Puse_precompiled_shaders=true -Pshadercross=/missing/shadercross -Plocalize=false
      - name: Reuse unchanged verified outputs
        working-directory: android
        run: |
          ./gradlew :app:compileAndroidShaders -Puse_precompiled_shaders=true -Pshadercross=/missing/shadercross -Plocalize=false > ../out/android-shader-task/up-to-date.log 2>&1
          grep -F ':app:compileAndroidShaders UP-TO-DATE' ../out/android-shader-task/up-to-date.log
      - name: Reject corrupt downloaded shaders
        working-directory: android
        run: |
          artifact=$(find ../data/shaders -name '*.spv' | sort | head -n 1)
          printf corrupt >> "$artifact"
          if ./gradlew :app:compileAndroidShaders -Puse_precompiled_shaders=true -Pshadercross=/missing/shadercross -Plocalize=false > ../out/android-shader-task/corrupt.log 2>&1; then
            echo 'Corrupt shaders unexpectedly accepted' >&2
            exit 1
          fi
          grep -Ei 'stale|hash|mismatch' ../out/android-shader-task/corrupt.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shader-task-evidence
          path: out/android-shader-task/
