name: capture-ab

on:
  push:
    branches: ["bench/**"]

permissions: { contents: read }

env:
  UPSTREAM: "https://github.com/scarf005/Cataclysm-BN.git"
  BEFORE: 9659ee28b66609b77a18e9087eb19167829444a7
  AFTER: 77180d94145051129e041993aa1e2d6fbf154100

# Binaries come from the capture-bins-11046 release; nothing is built here.
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: binaries and data
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libncursesw6 libsqlite3-0 tmux asciinema
          sudo locale-gen en_US.UTF-8
          gh release download capture-bins-11046 -R "$GITHUB_REPOSITORY" -p capture-bins-11046.tar.gz
          tar xzf capture-bins-11046.tar.gz
          for sha in "$AFTER" "$BEFORE"; do
            LD_LIBRARY_PATH="bins/$sha" ldd "bins/$sha/cataclysm-bn" | tee "bins/$sha/ldd.txt"
            ! grep 'not found' "bins/$sha/ldd.txt"
            git fetch --depth=1 "$UPSTREAM" "$sha"
            git worktree add --detach "$RUNNER_TEMP/tree-$sha" "$sha"
          done
          nproc; lscpu | sed -n 1,20p

      - name: record
        run: |
          mkdir -p out
          printf 'set -g default-terminal "xterm-256color"\n' > ~/.tmux.conf
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 WAIT_FOR=12h
          bash .github/capture/drive.sh fire "$PWD/bins/$BEFORE/cataclysm-bn" "$RUNNER_TEMP/tree-$BEFORE" "$PWD/bins/$AFTER/cataclysm-bn" "$RUNNER_TEMP/tree-$AFTER" "$PWD/out"

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capture-fire, path: out }
