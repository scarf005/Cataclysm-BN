name: capture-ab

on:
  push:
    branches: ["bench/**"]

permissions: { contents: write }

jobs:
  bins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: bins
          key: capture-bins2-9659ee28b66609b77a18e9087eb19167829444a7-77180d94145051129e041993aa1e2d6fbf154100
          fail-on-cache-miss: true
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tar czf capture-bins-11046.tar.gz bins
          gh release create capture-bins-11046 capture-bins-11046.tar.gz -R "$GITHUB_REPOSITORY" --prerelease \
            --title "capture bins 11046" --notes "curses builds of 9659ee28b6 (before) and 77180d9414 (after)"
