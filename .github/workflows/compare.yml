name: compare

on:
  push:
    branches: [ci/compare]
  workflow_dispatch:

env:
  LLVM_VERSION: "22"

jobs:
  walk:
    strategy:
      fail-fast: false
      matrix:
        target: [main, "10776", "10842", ours]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: "ci/cmp-${{ matrix.target }}", fetch-depth: 1 }

      - uses: actions/checkout@v4
        with: {
          path: harness,
          sparse-checkout: tests/profile_walk_test.cpp,
          sparse-checkout-cone-mode: false,
        }

      - run: cp harness/tests/profile_walk_test.cpp tests/ && rm -rf harness

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncursesw5-dev mold ripgrep gettext libsqlite3-dev zlib1g-dev libvulkan-dev mesa-vulkan-drivers xvfb \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
            libfreetype-dev libharfbuzz-dev libtiff-dev libavif-dev libwebp-dev libjpeg-dev libjxl-dev \
            libflac-dev libvorbis-dev libxmp-dev libmpg123-dev libwavpack-dev
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-common linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      - uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-${{ env.LLVM_VERSION }}
          cmake: true
          ninja: true
          setup-cpp: false

      - uses: denoland/setup-deno@v2

      - uses: ./.github/actions/build-shadercross

      - run: bash build-scripts/generate-shaders.sh

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: profile-tiles-${{ matrix.target }}
          restore-keys: profile-tiles-
          max-size: 2G

      - name: build
        run: |
          cmake --preset ci-tiles -DUSE_PREFIX_DATA_DIR=OFF -DCATA_FORMAT_TARGETS=OFF \
            -DCMAKE_C_FLAGS=-fno-omit-frame-pointer -DCMAKE_CXX_FLAGS=-fno-omit-frame-pointer
          cmake --build --preset ci-tiles --target cata_test-tiles -j 4

      - name: walk
        timeout-minutes: 120
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99 LP_NUM_THREADS=2 CATA_TEST_COMPUTE_ACCELERATION=cpu PROFILE_WALK_STEPS=2000
          sleep 1
          mkdir -p prof
          t=build/tests/cata_test-tiles
          for i in 1 2 3; do
            $t --gpu-backend=software --rng-seed 1 profile_walk 2>&1 | rg "PROFILE walk" | tee -a prof/walk.txt
          done
          perf record -F 499 -g -o prof/walk.data -- $t --gpu-backend=software --rng-seed 1 profile_walk > prof/perf-run.log 2>&1
          perf report -i prof/walk.data --stdio --no-children --percent-limit 0.3 -g none > prof/self.txt
          perf report -i prof/walk.data --stdio --children --percent-limit 1 -g caller,0.5,callee,function,percent --max-stack 40 > prof/tree.txt
          rm prof/walk.data
          { echo "### ${{ matrix.target }}"; cat prof/walk.txt; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-${{ matrix.target }}
          path: prof/
