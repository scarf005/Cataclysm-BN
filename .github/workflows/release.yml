name: "Magnum Opus Nightly"
concurrency: release
on:
  schedule:
    # Ahead of the 00:00 UTC nightly of cataclysmbn/Cataclysm-BN, which copies these bundles.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Nightly date to build, in UTC YYYY-MM-DD. Defaults to today."
        required: false
        type: string

env:
  VCPKG_BINARY_SOURCES: "default"
  # Each bundle, a no-soundpack one for Windows and both macOS, and the Windows PDB.
  EXPECTED_NIGHTLY_ASSET_COUNT: 8
  CLIENT_REPOSITORY: cataclysmbn/bn-client-egui

jobs:
  metadata:
    runs-on: ubuntu-slim
    outputs:
      changed: ${{ steps.env_vars.outputs.changed }}
      tag_name: ${{ steps.env_vars.outputs.tag_name }}
      engine_sha: ${{ steps.env_vars.outputs.engine_sha }}
      client_sha: ${{ steps.env_vars.outputs.client_sha }}
    steps:
      - id: env_vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_DATE: ${{ inputs.date || '' }}
        run: |
          TAG_NAME=${REQUESTED_DATE:-$(date -u --iso-8601)}
          if ! [[ "$TAG_NAME" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ "$(date -u --date="$TAG_NAME" +%F)" != "$TAG_NAME" ]; then
            echo "::error::date must be a valid UTC date in YYYY-MM-DD format"
            exit 1
          fi

          released_commit() { gh release view "$1" --json body --jq .body 2>/dev/null | sed -n "s|^$2 commit: .*/commit/\([0-9a-f]\{40\}\).*|\1|p"; }
          PREVIOUS_TAG_NAME=$(
            gh release list --limit 30 --json tagName --jq '.[].tagName' \
              | awk -v tag="$TAG_NAME" '/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ && $0 < tag' \
              | sort \
              | tail -n 1
          )
          ENGINE_SHA=$(released_commit "$TAG_NAME" Engine)
          ENGINE_SHA=${ENGINE_SHA:-$(gh api "repos/$GITHUB_REPOSITORY/commits/feat/magnum-opus" --jq .sha)}
          CLIENT_SHA=$(released_commit "$TAG_NAME" Client)
          CLIENT_SHA=${CLIENT_SHA:-$(gh api "repos/$CLIENT_REPOSITORY/commits/main" --jq .sha)}
          CHANGED=false
          if [ "$ENGINE_SHA" != "$(released_commit "$PREVIOUS_TAG_NAME" Engine)" ] || [ "$CLIENT_SHA" != "$(released_commit "$PREVIOUS_TAG_NAME" Client)" ]; then
            CHANGED=true
          fi

          echo "previous nightly: $PREVIOUS_TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "engine commit: $ENGINE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "client commit: $CLIENT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "engine_sha=$ENGINE_SHA" >> "$GITHUB_OUTPUT"
          echo "client_sha=$CLIENT_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: metadata
    name: Create Release
    runs-on: ubuntu-slim
    if: needs.metadata.outputs.changed == 'true'
    outputs:
      upload_assets: ${{ steps.asset_check.outputs.upload_assets }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
      ENGINE_SHA: ${{ needs.metadata.outputs.engine_sha }}
      CLIENT_SHA: ${{ needs.metadata.outputs.client_sha }}
    steps:
      - name: Create release
        run: |
          if gh release view "$TAG_NAME" --json tagName > /dev/null 2>&1; then exit 0; fi
          release_body="$RUNNER_TEMP/release-body.md"
          {
            echo "To play, run \`cataclysm-bn.exe\` on Windows or \`cataclysm-bn\` on Linux, or open \`Cataclysm.app\` on macOS."
            echo
            echo "Engine commit: https://github.com/$GITHUB_REPOSITORY/commit/$ENGINE_SHA"
            echo
            echo "Client commit: https://github.com/$CLIENT_REPOSITORY/commit/$CLIENT_SHA"
          } > "$release_body"
          gh release create "$TAG_NAME" \
            --title "Magnum Opus Nightly $TAG_NAME" \
            --notes-file "$release_body" \
            --prerelease \
            --target "$ENGINE_SHA"

      - name: Check release assets
        id: asset_check
        run: |
          asset_count=$(gh release view "$TAG_NAME" --json assets --jq '.assets | length')
          echo "asset_count=$asset_count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$asset_count" -lt "$EXPECTED_NIGHTLY_ASSET_COUNT" ]; then
            echo "upload_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload_assets=false" >> "$GITHUB_OUTPUT"
          fi

  build-translations:
    needs: [metadata, release]
    if: ${{ needs.release.outputs.upload_assets == 'true' }}
    uses: ./.github/workflows/build-translations.yml
    with:
      checkout-ref: ${{ needs.metadata.outputs.engine_sha }}
    secrets:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}

  builds:
    needs: [metadata, release, build-translations]
    if: ${{ needs.release.outputs.upload_assets == 'true' }}
    uses: ./.github/workflows/build.yml
    with:
      version-label: magnum-opus-${{ needs.metadata.outputs.tag_name }}
      checkout-ref: ${{ needs.metadata.outputs.engine_sha }}
      upload-to-release: true
      release-tag: ${{ needs.metadata.outputs.tag_name }}
      client-ref: ${{ needs.metadata.outputs.client_sha }}
      matrix-json: |
        [
          { "name": "Windows MSVC", "platform": "windows", "artifact": "windows-tiles-x64-msvc", "os": "windows-2022", "arch": "x64", "tiles": true, "sound": true, "ext": "zip", "content-type": "application/zip" },
          { "name": "Linux Tiles", "platform": "linux", "artifact": "linux-tiles-x64", "os": "ubuntu-latest", "tiles": true, "sound": true, "ext": "tar.gz", "content-type": "application/gzip" },
          { "name": "macOS Tiles", "platform": "macos", "artifact": "osx-tiles-x64", "os": "macos-15-intel", "preset": "osx-tiles-x64-dist", "tiles": true, "sound": true, "ext": "dmg", "content-type": "application/x-apple-diskimage" },
          { "name": "macOS Tiles ARM", "platform": "macos", "artifact": "osx-tiles-arm", "os": "macos-15", "preset": "osx-tiles-arm-dist", "tiles": true, "sound": true, "ext": "dmg", "content-type": "application/x-apple-diskimage" }
        ]
    secrets: inherit
