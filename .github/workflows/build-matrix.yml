# Reusable workflow for building multiple platform/configuration combinations
name: "Build Matrix Workflow"

on:
  workflow_call:
    inputs:
      version-label:
        description: "Version label for all builds"
        required: true
        type: string
      upload-to-release:
        description: "Upload to GitHub release"
        required: false
        type: boolean
        default: false
      release-tag:
        description: "Release tag to upload to (empty for experimental)"
        required: false
        type: string
        default: ""
    secrets:
      KEYSTORE:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEYSTORE_PROPERTIES:
        required: false

jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: Windows Tiles x64 MSVC
            artifact: windows-tiles-x64-msvc
            os: windows-latest
            arch: x64
            tiles: true
            sound: true
            ext: zip
            content-type: application/zip

          # Linux
          - name: Linux Tiles x64
            artifact: linux-tiles-x64
            os: ubuntu-latest
            tiles: true
            sound: true
            ext: tar.gz
            content-type: application/gzip

          - name: Linux Curses x64
            artifact: linux-curses-x64
            os: ubuntu-latest
            tiles: false
            sound: false
            ext: tar.gz
            content-type: application/gzip

          # macOS Intel
          - name: macOS Curses x64
            artifact: osx-curses-x64
            os: macos-15-intel
            tiles: false
            sound: false
            ext: dmg
            content-type: application/x-apple-diskimage

          - name: macOS Tiles x64
            artifact: osx-tiles-x64
            os: macos-15-intel
            tiles: true
            sound: true
            ext: dmg
            content-type: application/x-apple-diskimage

          # macOS ARM
          - name: macOS Curses ARM
            artifact: osx-curses-arm
            os: macos-15
            tiles: false
            sound: false
            ext: dmg
            content-type: application/x-apple-diskimage

          - name: macOS Tiles ARM
            artifact: osx-tiles-arm
            os: macos-15
            tiles: true
            sound: true
            ext: dmg
            content-type: application/x-apple-diskimage

          # Android
          - name: Android ARM64
            artifact: android-x64
            os: ubuntu-latest
            android: arm64
            ext: apk
            content-type: application/apk

          - name: Android Bundle
            artifact: android-bundle
            os: ubuntu-latest
            android: bundle
            ext: aab
            content-type: application/aap

    name: ${{ matrix.name }}
    uses: ./.github/workflows/build.yml
    with:
      artifact: ${{ matrix.artifact }}
      os: ${{ matrix.os }}
      tiles: ${{ matrix.tiles || false }}
      sound: ${{ matrix.sound || false }}
      android: ${{ matrix.android || 'none' }}
      arch: ${{ matrix.arch || 'x64' }}
      ext: ${{ matrix.ext }}
      content-type: ${{ matrix.content-type }}
      version-label: ${{ inputs.version-label }}
      upload-to-release: ${{ inputs.upload-to-release }}
      release-tag: ${{ inputs.release-tag }}
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
